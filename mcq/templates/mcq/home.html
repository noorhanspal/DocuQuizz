
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MCQ Generator</title>

    <link rel="stylesheet" href="{% static 'mcq/css/style.css' %}">
</head>
<body>

    <div class="container">
        <h1>AI MCQ Generator</h1>

        <p class="subtitle">
            Generate accurate MCQs from your documents using AI
        </p>

        <div class="upload-box">
            <h2>Upload Your Document</h2>
            <p>Supported formats: PDF, DOCX, JPG, PNG</p>

            <input
                type="file"
                id="document"
                accept=".pdf,.docx,.jpg,.jpeg,.png"
            >

            <p id="file-name">No file selected</p>

            <label for="difficulty">Difficulty Level</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

            <label for="question-count">Number of Questions</label>
            <input
                type="number"
                id="question-count"
                value="10"
                min="1"
                max="50"
            >

            <button type="button" id="generate-btn">
                Generate MCQs
            </button>

            <p id="message"></p>
        </div>
    </div>

    <script src="{% static 'mcq/js/script.js' %}"></script>
</body>
</html>
